name: Refresh snapshots

# Optional safety net. The page builds the 15-day pool live from PubMed
# (Europe PMC only when that pool is empty) and the builder feed live from
# follow-builders. This workflow commits the same PubMed snapshot, so the
# page still has articles when PubMed is down. 最近一周 is Crossref online
# dates plus PubMed abstracts, produced by the same script.
# Disable it by deleting this file if you don't want the commits.

on:
  schedule:
    # 21:40 UTC = 05:40 Asia/Shanghai — runs before the digest; off the top of the hour
    # because upstreams rate-limit on the hour.
    - cron: '40 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild snapshots
        run: python scripts/build_snapshot.py --days 15

      - name: Refresh open-access passages
        continue-on-error: true
        run: node scripts/fetch_oa_passages.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot-journals.json data/snapshot-builders.json functions/_lib/oa-passages.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            # 不要加 [skip ci]：Cloudflare Pages 识别它并跳过构建，每日快照就不会部署。
            git commit -m "chore: refresh snapshots"
            # 与 daily-digest.yml 保持一致：先 rebase 再 push，否则和用户/机器人并发推送会撞车
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
