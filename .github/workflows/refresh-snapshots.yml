name: Refresh snapshots

# Optional. The web app fetches live data from Europe PMC + follow-builders every time
# it opens, so this workflow is only a safety net (and lets the page work offline).
# Disable it by deleting this file if you don't want the commits.

on:
  schedule:
    # 21:40 UTC = 05:40 Asia/Shanghai — runs before the digest; off the top of the hour
    # because upstreams rate-limit on the hour.
    - cron: '40 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild snapshots
        run: python scripts/build_snapshot.py --days 30

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot-journals.json data/snapshot-builders.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh snapshots [skip ci]"
            git push
          fi
