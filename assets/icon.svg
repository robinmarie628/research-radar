<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="科研雷达">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cf5"/>
      <stop offset="1" stop-color="#15479e"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".32" cy=".28" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- radar rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".34" stroke-width="9">
    <circle cx="256" cy="256" r="176"/>
    <circle cx="256" cy="256" r="124"/>
    <circle cx="256" cy="256" r="72"/>
  </g>

  <!-- sweep -->
  <path d="M256 256 L256 80 A176 176 0 0 1 405 168 Z" fill="url(#sweep)" opacity=".55"/>

  <!-- ECG pulse across the middle -->
  <path d="M104 268 h56 l24 -54 l34 108 l30 -74 l22 40 h138"
        fill="none" stroke="#ffffff" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blips -->
  <circle cx="360" cy="168" r="15" fill="#ffffff"/>
  <circle cx="176" cy="344" r="11" fill="#ffffff" fill-opacity=".78"/>
</svg>
